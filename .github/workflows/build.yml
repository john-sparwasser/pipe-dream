name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0               # git describe below needs the tag history
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # A tagged build is stamped with its tag ("v0.0.2" -> 0.0.2) so the updater's version
      # compare agrees with the release feed (UpdateCheck.ParseTag). An untagged build gets
      # the latest tag plus the run number as a FOURTH part (0.0.2.123): the updater compares
      # three parts (UpdateCheck.Normalise), so a CI build never outranks the release line —
      # the old 0.1.<run> scheme sat above every 0.0.x release and made installed CI builds
      # deaf to updates forever.
      - name: Pick the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            base=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
            echo "VERSION=${base#v}.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      # ROM-dependent tests skip themselves when no SMW ROM is present, which is always here.
      - run: dotnet test src/tests/PipeDream.Tests.csproj -c Release

      # One file: the runtime and every dependency live inside the executable, unpacked to a
      # temp dir on first run. Native libraries need the second flag to come along; without
      # it they stay beside the exe and the "single file" is a lie.
      - run: >
          dotnet publish src/PipeDream.csproj -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ env.VERSION }}
          -o bin/publish

      # The updater's contract (UpdateCheck.WantsAsset): the Linux asset's name contains
      # "linux" and the file IS the binary — Apply() renames the download over the installed
      # exe — so it ships under this name, never zipped.
      - name: Name the linux binary for the release feed
        if: matrix.os != 'windows-latest'
        run: mv bin/publish/PipeDream bin/publish/PipeDream-linux-x64
      - uses: actions/upload-artifact@v7
        if: matrix.os != 'windows-latest'      # Windows ships the installer below, not a loose exe
        with:
          name: PipeDream-${{ matrix.rid }}
          path: bin/publish/PipeDream-linux-x64

      # Windows ships an installer instead of the bare exe. Inno Setup is on the runner image;
      # the version always moves forward, so every build upgrades over the last one.
      - name: Build installer
        if: matrix.os == 'windows-latest'
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ env.VERSION }} install\PipeDream.iss

      # An installer nobody ran is a guess. Install it silently, check the three things it
      # promises, then take it back off and check that too.
      - name: Check the installer installs and uninstalls
        if: matrix.os == 'windows-latest'
        run: |
          $setup = Get-Item bin\setup\PipeDream-Setup.exe
          Start-Process $setup '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\PipeDream\PipeDream.exe"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Pipe Dream.lnk"
          if (-not (Test-Path $app)) { throw "no exe at $app" }
          if (-not (Test-Path $lnk)) { throw "no Start Menu shortcut" }
          $progId = (Get-ItemProperty 'HKCU:\Software\Classes\.pdp').'(default)'
          if ($progId -ne 'PipeDream.Project') { throw ".pdp -> '$progId'" }
          # The editor is a GUI-subsystem binary, so PowerShell does not wait on it and never
          # sets $LASTEXITCODE — Start-Process is the only way to read the code back.
          $check = Start-Process $app '--selfcheck' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "installed binary failed --selfcheck ($($check.ExitCode))" }
          # Inno's uninstaller relaunches itself from a temp copy, so -Wait returns early.
          Start-Process (Get-Item "$env:LOCALAPPDATA\Programs\PipeDream\unins*.exe") '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $app) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $app) { throw 'uninstall left the exe behind' }

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: PipeDream-Setup
          path: bin/setup/*.exe

  # Pushing a v* tag publishes the verified builds as a GitHub release — the feed the in-app
  # updater reads (UpdateCheck.Repo). Both matrix legs must pass first, so a release asset is
  # always a build whose tests ran and whose installer installed and uninstalled cleanly.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # Announce it in Discord: the generated notes as the embed body, one field per asset
      # holding its direct download link. gh ships its own jq engine (--jq), so this needs
      # nothing installed. Skipped when the secret is unset, so a fork tagging a build does
      # not fail here. The 3800-char slice keeps long notes under Discord's 4096 cap.
      - name: Announce the release in Discord
        if: env.DISCORD_WEBHOOK != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body,url,assets --jq '{
              embeds: [{
                title: "Pipe Dream \(env.GITHUB_REF_NAME)",
                url: .url,
                color: 3447003,
                description: ((.body // "") | .[0:3800]),
                fields: [.assets[] | {
                  name: .name,
                  value: "[Download](\(.url)) · \(.size / 1048576 | floor) MB",
                  inline: true
                }]
              }]
            }' |
          curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK"
