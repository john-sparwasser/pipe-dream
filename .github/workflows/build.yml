name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # ROM-dependent tests skip themselves when no SMW ROM is present, which is always here.
      - run: dotnet test src/tests/PipeDream.Tests.csproj -c Release

      # One file: the runtime and every dependency live inside the executable, unpacked to a
      # temp dir on first run. Native libraries need the second flag to come along; without
      # it they stay beside the exe and the "single file" is a lie.
      - run: >
          dotnet publish src/PipeDream.csproj -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=0.1.${{ github.run_number }}
          -o bin/publish
      - uses: actions/upload-artifact@v7
        if: matrix.os != 'windows-latest'      # Windows ships the installer below, not a loose exe
        with:
          name: PipeDream-${{ matrix.rid }}
          path: bin/publish

      # Windows ships an installer instead of the bare exe. Inno Setup is on the runner image;
      # the version is the run number, so every build upgrades over the last one.
      - name: Build installer
        if: matrix.os == 'windows-latest'
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=0.1.${{ github.run_number }} install\PipeDream.iss

      # An installer nobody ran is a guess. Install it silently, check the three things it
      # promises, then take it back off and check that too.
      - name: Check the installer installs and uninstalls
        if: matrix.os == 'windows-latest'
        run: |
          $setup = Get-Item bin\setup\PipeDream-Setup-*.exe
          Start-Process $setup '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\PipeDream\PipeDream.exe"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Pipe Dream.lnk"
          if (-not (Test-Path $app)) { throw "no exe at $app" }
          if (-not (Test-Path $lnk)) { throw "no Start Menu shortcut" }
          $progId = (Get-ItemProperty 'HKCU:\Software\Classes\.pdp').'(default)'
          if ($progId -ne 'PipeDream.Project') { throw ".pdp -> '$progId'" }
          # The editor is a GUI-subsystem binary, so PowerShell does not wait on it and never
          # sets $LASTEXITCODE — Start-Process is the only way to read the code back.
          $check = Start-Process $app '--selfcheck' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "installed binary failed --selfcheck ($($check.ExitCode))" }
          # Inno's uninstaller relaunches itself from a temp copy, so -Wait returns early.
          Start-Process (Get-Item "$env:LOCALAPPDATA\Programs\PipeDream\unins*.exe") '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $app) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $app) { throw 'uninstall left the exe behind' }

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: PipeDream-Setup
          path: bin/setup/*.exe
