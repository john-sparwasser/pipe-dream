name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ROM-dependent tests skip themselves when no SMW ROM is present, which is always here.
      - run: dotnet test src/tests/PipeDream.Tests.csproj -c Release

      - run: dotnet publish src/PipeDream.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o bin/publish
      - uses: actions/upload-artifact@v4
        with:
          name: PipeDream-${{ matrix.rid }}
          path: bin/publish
