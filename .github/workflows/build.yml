name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    # Named only so Azure has a stable OIDC subject to trust. A federated credential scoped to
    # a branch or a tag would need one entry per ref — and Azure does not take wildcards outside
    # a preview feature — so a tagged release build could not authenticate. An environment
    # subject is ref-independent: one credential covers main, tags and everything else.
    # Leave it free of protection rules or every build waits for a review.
    environment: release
    permissions:
      contents: read
      id-token: write            # the OIDC token azure/login trades for an Azure one
    # Step-level `if` cannot read the secrets context, so the signing key is lifted into env
    # here and the steps below test that — the same trick the Discord step in announce.yml
    # uses. Unset (a fork, or before signing is set up) means the signing steps skip and the
    # build still produces an unsigned installer.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0               # git describe below needs the tag history
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # A tagged build is stamped with its tag ("v0.0.2" -> 0.0.2) so the updater's version
      # compare agrees with the release feed (UpdateCheck.ParseTag). An untagged build gets
      # the latest tag plus the run number as a FOURTH part (0.0.2.123): the updater compares
      # three parts (UpdateCheck.Normalise), so a CI build never outranks the release line —
      # the old 0.1.<run> scheme sat above every 0.0.x release and made installed CI builds
      # deaf to updates forever.
      - name: Pick the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            base=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
            echo "VERSION=${base#v}.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      # ROM-dependent tests skip themselves when no SMW ROM is present, which is always here.
      - run: dotnet test src/tests/PipeDream.Tests.csproj -c Release

      # One file: the runtime and every dependency live inside the executable, unpacked to a
      # temp dir on first run. Native libraries need the second flag to come along; without
      # it they stay beside the exe and the "single file" is a lie.
      - run: >
          dotnet publish src/PipeDream.csproj -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ env.VERSION }}
          -o bin/publish

      # Signing, in two passes: the binary here, then the installer once ISCC has wrapped it.
      # Both matter — the installer is what SmartScreen judges on download, and the binary is
      # what runs afterwards — and the inner one has to be signed BEFORE it is packaged, since
      # Inno embeds a copy rather than referencing the file.
      #
      # One login covers both passes; the az CLI session it leaves behind is what the signing
      # action's DefaultAzureCredential picks up (see the credential excludes below).
      - name: Azure login
        if: matrix.os == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the binary
        if: matrix.os == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@v2
        with:
          # endpoint region, account and profile must match the Artifact Signing account.
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: pipedream-signing
          certificate-profile-name: PipeDreamRelease
          files-folder: ${{ github.workspace }}\bin\publish
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # azure/login leaves an az CLI session, so that is the only credential to try; the
          # rest are excluded because DefaultAzureCredential would otherwise spend a while
          # failing over through them first.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # The updater's contract (UpdateCheck.WantsAsset): the Linux asset's name contains
      # "linux" and the file IS the binary — Apply() renames the download over the installed
      # exe — so it ships under this name, never zipped.
      - name: Name the linux binary for the release feed
        if: matrix.os != 'windows-latest'
        run: mv bin/publish/PipeDream bin/publish/PipeDream-linux-x64
      - uses: actions/upload-artifact@v7
        if: matrix.os != 'windows-latest'      # Windows ships the installer below, not a loose exe
        with:
          name: PipeDream-${{ matrix.rid }}
          path: bin/publish/PipeDream-linux-x64

      # Windows ships an installer instead of the bare exe. Inno Setup is on the runner image;
      # the version always moves forward, so every build upgrades over the last one.
      - name: Build installer
        if: matrix.os == 'windows-latest'
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ env.VERSION }} install\PipeDream.iss

      # The download a user actually clicks — the one SmartScreen forms an opinion about. Signed
      # before the install check below, so what CI exercises is the artifact that ships.
      - name: Sign the installer
        if: matrix.os == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: pipedream-signing
          certificate-profile-name: PipeDreamRelease
          files-folder: ${{ github.workspace }}\bin\setup
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # An installer nobody ran is a guess. Install it silently, check the three things it
      # promises, then take it back off and check that too.
      - name: Check the installer installs and uninstalls
        if: matrix.os == 'windows-latest'
        run: |
          $setup = Get-Item bin\setup\PipeDream-Setup.exe
          Start-Process $setup '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\PipeDream\PipeDream.exe"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Pipe Dream.lnk"
          if (-not (Test-Path $app)) { throw "no exe at $app" }
          if (-not (Test-Path $lnk)) { throw "no Start Menu shortcut" }
          $progId = (Get-ItemProperty 'HKCU:\Software\Classes\.pdp').'(default)'
          if ($progId -ne 'PipeDream.Project') { throw ".pdp -> '$progId'" }
          # The editor is a GUI-subsystem binary, so PowerShell does not wait on it and never
          # sets $LASTEXITCODE — Start-Process is the only way to read the code back.
          $check = Start-Process $app '--selfcheck' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "installed binary failed --selfcheck ($($check.ExitCode))" }
          # Catches the ordering trap: sign bin\publish after ISCC has already packaged it and
          # the installer is signed while the binary it lays down is not, which no other check
          # here would notice.
          if ($env:AZURE_CLIENT_ID) {
            $sig = Get-AuthenticodeSignature $app
            if ($sig.Status -ne 'Valid') { throw "installed binary signature: $($sig.Status)" }
          }
          # Inno's uninstaller relaunches itself from a temp copy, so -Wait returns early.
          Start-Process (Get-Item "$env:LOCALAPPDATA\Programs\PipeDream\unins*.exe") '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $app) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $app) { throw 'uninstall left the exe behind' }

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: PipeDream-Setup
          path: bin/setup/*.exe

  # Pushing a v* tag uploads the verified builds as a DRAFT release — the feed the in-app
  # updater reads (UpdateCheck.Repo) skips drafts, so nothing ships until someone publishes
  # it. Both matrix legs must pass first, so a release asset is always a build whose tests
  # ran and whose installer installed and uninstalled cleanly.
  #
  # The notes are written by hand, not generated: after the draft appears, write them and
  # publish in one step —
  #     gh release edit vX.Y.Z --draft=false --notes-file notes.md
  # Publishing is what announces it (announce.yml), with those notes as the body.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --draft --notes ""
        env:
          GH_TOKEN: ${{ github.token }}
