name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ROM-dependent tests skip themselves when no SMW ROM is present, which is always here.
      - run: dotnet test src/tests/PipeDream.Tests.csproj -c Release

      - run: dotnet publish src/PipeDream.csproj -c Release -r win-x64 --self-contained true -o bin/publish
      - uses: actions/upload-artifact@v4
        with:
          name: PipeDream-win-x64
          path: bin/publish
